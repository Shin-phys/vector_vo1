<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ベクトルで運動を表す</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="profile-tablet">

  <header id="topbar">
    <button id="homeBtn" type="button" aria-label="トップへもどる" title="トップへもどる">🏠</button>
    <div id="steps" class="steps"></div>
    <button id="settingsBtn" type="button" aria-label="設定">⚙</button>
  </header>

  <div id="app">
    <div id="scalebar"></div>

    <section id="stage">
      <div id="canvasHost"></div>
    </section>

    <div id="prompt" class="prompt"></div>

    <div id="readout" class="readout"></div>

    <aside id="side">
      <div id="feedback" class="feedback"></div>
      <div id="interact"></div>
      <div id="hintBox"></div>
    </aside>
  </div>

  <footer id="actionbar"></footer>
  <div id="modalRoot" style="display:none"></div>

  <noscript>このページを使うには JavaScript を有効にしてください。</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
